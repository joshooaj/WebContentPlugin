# Dependabot version updates (ticket #30).
#
# Surfaces kept fresh:
#   - GitHub Actions workflow pins (SHA + trailing version comment stay in sync)
#   - the .NET CLI tools manifest (.config/dotnet-tools.json: nbgv, wix, sbom-tool)
#   - NuGet PackageReferences (src/WebContent, src/WebContent.Tests)
#
# Minor+patch bumps are grouped per ecosystem into one PR; majors open as their own
# PRs (no ignore-conditions — CI green/red is the judge). All feeds are public
# nuget.org; MilestoneSystems.VideoOS.Platform is public and resolves without
# credentials, so no ignore-conditions for it either.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions-minor-and-patch:
        patterns: ["*"]
        update-types:
          - minor
          - patch

  # "/" picks up the .config/dotnet-tools.json CLI tools manifest; the NuGet
  # provider does not recurse into subdirectories, so the projects with
  # PackageReferences are listed explicitly (tests/ux deliberately excluded —
  # CI does not gate that project).
  - package-ecosystem: nuget
    directories:
      - "/"
      - "/src/WebContent"
      - "/src/WebContent.Tests"
    schedule:
      interval: weekly
    groups:
      nuget-minor-and-patch:
        patterns: ["*"]
        update-types:
          - minor
          - patch
